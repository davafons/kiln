# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_mode:
  merge:
    - Exclude

# docs/ is a Rails app linted with the gem's own style. Skip what it generates or installs.
AllCops:
  Exclude:
    - "docs/dist/**/*"
    - "docs/tmp/**/*"
    - "docs/vendor/**/*"
