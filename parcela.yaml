version: 1
project: kiln

services:
  # The docs site in development, reloaded by Hotwire Spark.
  web:
    working_dir: docs
    command: bin/rails server -p $PORT -b 127.0.0.1
    http:
      healthcheck: /
  # Kiln has no watcher of its own; tailwindcss-rails rebuilds the CSS.
  css:
    working_dir: docs
    command: bin/rails tailwindcss:watch[always]

hooks:
  setup:
    command: cd docs && (bundle check || bundle install)
  prestart:
    command: cd docs && bin/rails tailwindcss:build
